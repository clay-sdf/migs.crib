<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Migs' Crib — PRC ECE Board Exam Tracker</title>

  <!-- Messenger / Facebook Preview Card (Full URLs Required!) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://netlify.app" />
  <meta property="og:title" content="Migs' Crib" />
  <meta property="og:description" content="My crib brings you to your personal PRC ECE Board Exam Tracker (2022 TOS Edition). B)" />
  <meta property="og:image" content="https://netlify.appbanner.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- JavaScript-Only Redirect (Bots stay and read the card; real visitors teleport instantly!) -->
  <script>
    window.location.replace("https://sites.google.com/view/prceceboardexamtracker/migscrib");
  </script>

  <!-- Matching Theme Fonts & Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            hand: ['Caveat', 'cursive']
          }
        }
      }
    };
  </script>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes loadingSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .float-badge {
      animation: floatSlow 3.2s ease-in-out infinite;
    }
    .progress-sweep {
      animation: loadingSweep 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient Sunset + Tech Glow Orbs (Matching Tracker Aesthetic) -->
  <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-blue-600/20 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-28 -right-20 w-96 h-96 rounded-full bg-amber-500/15 blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 right-1/4 w-64 h-64 rounded-full bg-cyan-500/10 blur-3xl pointer-events-none"></div>

  <!-- Main Crib Portal Card -->
  <main class="relative z-10 w-full max-w-md rounded-3xl bg-slate-900/90 backdrop-blur-xl border border-slate-800/90 shadow-2xl p-6 sm:p-8 text-center space-y-6">

    <!-- Top Cute Status Pill -->
    <div class="flex items-center justify-center">
      <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[11px] font-mono font-bold bg-blue-950/90 text-cyan-300 border border-blue-800/70">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>2022 TOS EDITION • WARPING IN</span>
      </span>
    </div>

    <!-- Floating CPU + Crib Icon -->
    <div class="flex justify-center">
      <div class="float-badge relative w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-700 via-blue-600 to-cyan-500 text-white flex items-center justify-center shadow-lg shadow-blue-600/30 border border-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <rect width="16" height="16" x="4" y="4" rx="2" />
          <rect width="6" height="6" x="9" y="9" rx="1" />
          <path d="M15 2v2" /><path d="M15 20v2" />
          <path d="M2 15h2" /><path d="M2 9h2" />
          <path d="M20 15h2" /><path d="M20 9h2" />
          <path d="M9 2v2" /><path d="M9 20v2" />
        </svg>
        <span class="absolute -bottom-2 -right-2 px-2 py-0.5 rounded-lg bg-amber-400 text-slate-950 font-mono text-[10px] font-extrabold shadow">
          B)
        </span>
      </div>
    </div>

    <!-- Title & Handwritten Crib Subtitle -->
    <div class="space-y-1.5">
      <h1 class="font-display text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
        Migs' Crib
      </h1>
      <p class="font-hand text-2xl text-amber-300 tracking-wide">
        Future Engr. loading... welcome to the study zone! ✨
      </p>
      <p class="text-xs sm:text-sm text-slate-400 leading-relaxed pt-1">
        Teleporting you to your personal <strong class="text-slate-200">PRC ECE Board Exam Tracker</strong>.
      </p>
    </div>

    <!-- Animated Loading Bar -->
    <div class="space-y-2">
      <div class="w-full h-2 rounded-full bg-slate-800 overflow-hidden relative">
        <div class="progress-sweep w-2/3 h-full rounded-full bg-gradient-to-r from-blue-600 via-cyan-400 to-amber-400"></div>
      </div>
      <p class="font-mono text-[11px] text-slate-500">
        Connecting to <span class="text-cyan-400">prceceboardexamtracker/migscrib</span>...
      </p>
    </div>

    <!-- Direct Manual Fallback Button -->
    <div class="pt-1">
      <a
        href="https://sites.google.com/view/prceceboardexamtracker/migscrib"
        class="inline-flex items-center justify-center gap-2 w-full py-3 px-5 rounded-2xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white text-xs sm:text-sm font-extrabold shadow-lg shadow-blue-600/25 transition active:scale-[0.98]"
      >
        <span>Enter Migs' Crib Now</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="m12 5 7 7-7 7" />
        </svg>
      </a>
    </div>

  </main>

</body>
</html>
